name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Steamless.sln

      - name: Build CLI + all plugin projects
        run: |
          dotnet build Steamless.CLI -c Release --no-restore
          dotnet build ExamplePlugin -c Release --no-restore
          for proj in Variant10.x86 Variant20.x86 Variant21.x86 Variant30.x86 Variant30.x64 Variant31.x86 Variant31.x64; do
            echo "Building Steamless.Unpacker.$proj..."
            dotnet build "Steamless.Unpacker.$proj" -c Release --no-restore
          done

      - name: Build GUI (Windows only)
        if: runner.os == 'Windows'
        run: dotnet build Steamless/Steamless.csproj -c Release --no-restore
